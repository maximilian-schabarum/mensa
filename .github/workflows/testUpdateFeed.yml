name: 🕵🏽‍♀️ RunParsersTest

on:
  workflow_dispatch:
    inputs:
      cmdParams:
        description: 'cmd parameters'
        required: true
        default: '-parser markas'
        type: string
jobs:
  testGenerateXMLFeeds:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Install requirements.txt
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Generate Pages site
      run: |
        echo python updateFeeds.py ${{ github.event.inputs.cmdParams }} -meta -feed -json -index
        rm -rf site
        python updateFeeds.py ${{ github.event.inputs.cmdParams }} -meta -feed -json -index -out site
        python updateFeeds.py -today -out site
        cp docs/favicon.ico site/favicon.ico
        touch site/.nojekyll
    - name: Test files in github pages
      run: |
        GHPAGES_PATH=site python tests/test_ghpages.py
    - name: Upload github pages /docs/ artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: github-pages-docs
        path: site/
