name: 🔂 RunParsersToday

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 3-12 * * 1-5" # UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: parsers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generateXMLFeedsToday:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Install requirements.txt
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Generate complete Pages site
      run: |
        rm -rf site
        python updateFeeds.py -meta -feed -json -out site
        python updateFeeds.py -today -out site
        cp archive/speierlingshof_speierlingshof-archiv.xml site/feed/
        python updateFeeds.py -index -out site
        cp docs/favicon.ico site/favicon.ico
        touch site/.nojekyll
    - name: Test generated Pages site
      run: |
        GHPAGES_PATH=site python tests/test_ghpages.py
    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5
    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site
    - name: Deploy GitHub Pages artifact
      id: deployment
      uses: actions/deploy-pages@v4
    - name: Trigger OpenMensa fetch
      run: |
        bash scripts/openmensa_fetch.sh fetch
