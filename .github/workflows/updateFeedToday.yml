name: 🔂 RunParsersToday

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 3-12 * * 1-5" # UTC

concurrency:
  group: parsers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generateXMLFeedsToday:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Install requirements.txt
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: git config
      run: |
        git config --global user.name github-actions
        git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
        git pull --ff-only
    - name: Run parsers & update xml feeds
      run: |
        python updateFeeds.py -today
    - name: Mark changed Taberna feed for OpenMensa
      run: |
        bash scripts/openmensa_fetch.sh mark-pending
    - name: git commit & push
      run: |
        git add docs
        if ! git diff --cached --quiet; then
          git commit -m "Updated xml feeds"
          git push
        fi
    - name: Trigger pending OpenMensa fetch
      run: |
        bash scripts/openmensa_fetch.sh fetch-pending
    - name: Clear completed OpenMensa fetch marker
      run: |
        git add docs
        if ! git diff --cached --quiet; then
          git commit -m "Completed OpenMensa feed fetch"
          git push
        fi
    - name: Test files in github pages
      run: |
        python tests/test_ghpages.py
