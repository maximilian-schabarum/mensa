name: 🔁 RunParsers

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
    - 'docs/**'
  schedule:
    - cron: "31 6,8 * * *" # UTC
    - cron: "59 23 * * 0" # Run once sunday night

concurrency:
  group: parsers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generateXMLFeeds:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Install requirements.txt
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: git config
      run: |
        git config --global user.name github-actions
        git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
        git pull --ff-only
    - name: Run parsers & update xml feeds
      run: |
        python updateFeeds.py -meta -feed -json -index
    - name: Mark changed Taberna feed for OpenMensa
      run: |
        bash scripts/openmensa_fetch.sh mark-pending
    - name: git commit & push
      if: always()
      run: |
        touch docs/.nojekyll
        git add docs
        if ! git diff --cached --quiet; then
          git commit -m "Updated xml feeds"
          git push
        fi
    - name: Trigger pending OpenMensa fetch
      if: success()
      run: |
        bash scripts/openmensa_fetch.sh fetch-pending
    - name: Clear completed OpenMensa fetch marker
      if: success()
      run: |
        git add docs
        if ! git diff --cached --quiet; then
          git commit -m "Completed OpenMensa feed fetch"
          git push
        fi
    - name: Test files in github pages
      if: always()
      run: |
        python tests/test_ghpages.py
